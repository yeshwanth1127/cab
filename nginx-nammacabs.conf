server {
    listen 80;
    server_name namma-cabs.com www.namma-cabs.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name namma-cabs.com www.namma-cabs.com;

    ssl_certificate /etc/letsencrypt/live/namma-cabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/namma-cabs.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/nammacabs/cab/frontend/build;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Keep /api/* path unchanged when proxying to backend.
        proxy_pass http://127.0.0.1:3223;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
